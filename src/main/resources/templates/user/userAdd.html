<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>新規会員登録</title>
</head>

<body>

	<main>
		<h1>新規会員登録</h1>

		<form th:action="@{/add/account/confirm}" method="post" th:object="${userAddForm}"  class="form-table h-adr">
			<input type="hidden" class="p-country-name" value="Japan">
			<table border="1">
				<tr>
					<th>名前</th>
					<td>
						<input type="text" th:field="*{name}">
						<div th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
					</td>
				</tr>
				<tr>
					<th>性別</th>
					<td>
						<select th:field="*{gender}">
							<option value="" selected>選択してください</option>
							<option value="男性">男性</option>
							<option value="女性">女性</option>
							<option value="その他">その他</option>
						</select>
						<div th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"></div>
					</td>
				</tr>
				<tr>
					<th>郵便番号</th>
					<td>
						<input type="number" th:field="*{postCode}" class="p-postal-code" maxlength="8">
						<div th:if="${#fields.hasErrors('postCode')}" th:text="${errorMap.postCode}"></div>
					</td>
				</tr>
				<tr>
					<th>都道府県</th>
					<td>
						<select th:field="*{prefecture}" class="p-region">
							<option value="" selected>選択してください</option>
							<option 
							th:each="prefecture:${prefectureList}" 
							th:text="${prefecture.name}" 
							th:value="${prefecture.name}"></option>
						</select>
						<div th:if="${#fields.hasErrors('prefecture')}" th:errors="*{prefecture}"></div>
					</td>
				</tr>
				<tr>
					<th>住所</th>
					<td>
						<input type="text" th:field="*{location}" class="p-locality p-street-address p-extended-address">
						<div th:if="${#fields.hasErrors('location')}" th:errors="*{location}"></div>
					</td>
				</tr>
				<tr>
					<th>電話番号</th>
					<td>
						<input type="number" th:field="*{tell}">
						<div th:if="${#fields.hasErrors('tell')}" th:text="${errorMap.tell}"></div>
					</td>
				</tr>
				<tr>
					<th>メールアドレス</th>
					<td>
						<input type="text" th:field="*{email}">
						<div th:if="${#fields.hasErrors('email')}" th:text="${errorMap.email}"></div>
					</td>
				</tr>
				<tr>
					<th>パスワード</th>
					<td>
						<input type="password" th:field="*{password}">
						<div th:if="${#fields.hasErrors('password')}" th:text="${errorMap.password}"></div>
					</td>
				</tr>
				<tr>
					<th>パスワード（再入力）</th>
					<td>
						<input type="password" th:field="*{passwordConfirm}">
					</td>
				</tr>
			</table>
			
			<button>確認</button>
		</form>
		
		<script th:inline="javascript" src="https://yubinbango.github.io/yubinbango/yubinbango.js">
		</script>
		</main>

</body>

</html>
