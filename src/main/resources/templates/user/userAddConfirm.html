<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>登録内容確認</title>
</head>
<body>

	<main>
		
		<form action="/add/account" method="post" th:object="${userAddForm}">
		
		<table border="1">
			<tr>
				<th>名前</th>
				<td th:text="*{name}"></td>
			</tr>
			<tr>
				<th>性別</th>
				<td th:text="*{gender}"></td>
			</tr>
			<tr>
				<th>郵便番号</th>
				<td th:text="*{postCode}"></td>
			</tr>
			<tr>
				<th>都道府県</th>
				<td th:text="*{prefecture}"></td>
			</tr>
			<tr>
				<th>住所</th>
				<td th:text="*{location}"></td>
			</tr>
			<tr>
				<th>電話番号</th>
				<td th:text="*{tell}"></td>
			</tr>
			<tr>
				<th>メールアドレス</th>
				<td th:text="*{email}"></td>
			</tr>
			<tr>
				<th>パスワード</th>
				<td>**********</td>
			</tr>
		</table>
		
		<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
		<input type="hidden" th:field="*{name}">
		<input type="hidden" th:field="*{gender}">
		<input type="hidden" th:field="*{postCode}">
		<input type="hidden" th:field="*{prefecture}">
		<input type="hidden" th:field="*{location}">
		<input type="hidden" th:field="*{tell}">
		<input type="hidden" th:field="*{email}">
		<input type="hidden" th:field="*{password}">
		<input type="hidden" th:field="*{passwordConfirm}">
		
		<button>登録</button>
		
		</form>
	</main>
	
</body>
</html>
